<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Student Portal</title>
    <link rel="stylesheet" href="../css/signup.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.emailjs.com/sdk/2.6.4/email.min.js"></script>
    <style>
        .alert {
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            display: none;
        }
        .alert.alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert.alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert.hidden {
            display: none;
        }
        .alert:not(.hidden) {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="signup-card">
            <h1>Create Account</h1>
            <div class="role-selector">
                <h2>I am a:</h2>
                <div class="role-buttons">
                    <button class="role-btn active" data-role="prospective">
                        <img src="../assets/reading.png" alt="Prospective Student" style="width:48px;height:48px;margin-bottom:0.75rem;">
                        <span>Prospective Student</span>
                    </button>
                    <button class="role-btn" data-role="current">
                        <img src="../assets/graduated.png" alt="Current Student" style="width:48px;height:48px;margin-bottom:0.75rem;">
                        <span>Current Student</span>
                    </button>
                </div>
            </div>

            <form id="signup-form">
                <!-- Prospective Student Form -->
                <div class="form-section" id="prospective-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </div>
                    <div class="form-group">
                        <label for="interested-colleges">Interested Colleges (Optional)</label>
                        <input type="text" id="interested-colleges" name="interested-colleges" 
                               placeholder="e.g., MIT, Stanford, Harvard"
                               data-required="false">
                        <span class="help-text">Separate multiple colleges with commas</span>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" 
                                   placeholder="Create a strong password" required>
                            <button type="button" class="toggle-password">
                                <img src="../assets/eye.svg" alt="Toggle Password">
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-meter">
                                <div class="strength-fill"></div>
                            </div>
                            <span class="strength-text">Password Strength</span>
                        </div>
                    </div>
                </div>

                <!-- Current Student Form -->
                <div class="form-section hidden" id="current-form">
                    <div class="form-group">
                        <label for="name-current">Full Name</label>
                        <input type="text" id="name-current" name="name-current" 
                               placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="college">College/University</label>
                        <input type="text" id="college" name="college" 
                               placeholder="Enter your college name" required>
                        <span class="help-text">Enter the full name of your institution</span>
                    </div>
                    <div class="form-group">
                        <label for="college-email">College Email</label>
                        <input type="email" id="college-email" name="college-email" 
                               placeholder="Enter your college email" required>
                        <span class="help-text">Must be your official college email address</span>
                    </div>
                    <div class="form-group">
                        <label for="graduation-year">Expected Graduation Year</label>
                        <select id="graduation-year" name="graduation-year" required>
                            <option value="">Select Year</option>
                            <!-- Will be populated by JavaScript -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="major">Major/Field of Study</label>
                        <input type="text" id="major" name="major" 
                               placeholder="e.g., Computer Science" required>
                    </div>
                    <div class="form-group">
                        <label for="password-current">Password</label>
                        <div class="password-input">
                            <input type="password" id="password-current" name="password-current" 
                                   placeholder="Create a strong password" required>
                            <button type="button" class="toggle-password">
                                <img src="../assets/eye.svg" alt="Toggle Password">
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-meter">
                                <div class="strength-fill"></div>
                            </div>
                            <span class="strength-text">Password Strength</span>
                        </div>
                    </div>
                </div>

                <div class="alert" id="signup-alert"></div>

                <button type="submit" class="submit-btn">Create Account</button>

                <p class="login-link">
                    Already have an account? <a href="login.html">Sign In</a>
                </p>
            </form>
        </div>
    </div>
    <script src="../js/signup.js"></script>
</body>
</html>
